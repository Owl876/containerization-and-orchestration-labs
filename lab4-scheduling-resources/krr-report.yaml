description: '[b]Simple_Limit Strategy[/b]


  CPU request: 66.0% percentile, limit: 96.0% percentile

  Memory request: max + 15.0%, limit: max + 15.0%

  History: 24.0 hours

  Step: 1.0 minutes


  All parameters can be customized. For example: `krr simple_limit --cpu_request=66
  --cpu_limit=96 --memory_buffer_percentage=15 --history_duration=24 --timeframe_duration=0.5`


  This strategy does not work with objects with HPA defined (Horizontal Pod Autoscaler).

  If HPA is defined for CPU or Memory, the strategy will return "?" for that resource.

  You can override this behaviour by passing the --allow-hpa flag


  Learn more: [underline]https://github.com/robusta-dev/krr#algorithm[/underline]'
strategy:
  name: simple_limit
  settings:
    history_duration: 24.0
    timeframe_duration: 1.0
    cpu_request: 66.0
    cpu_limit: 96.0
    memory_buffer_percentage: 15.0
    points_required: 30
    allow_hpa: false
    use_oomkill_data: false
    oom_memory_buffer_percentage: 25.0
