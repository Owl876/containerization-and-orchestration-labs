apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-batch
  labels:
    app: batch
spec:
  replicas: {{ .Values.batch.replicaCount }}
  selector:
    matchLabels:
      app: batch
  template:
    metadata:
      labels:
        app: batch
    spec:
      priorityClassName: {{ .Values.priority.batch.name }}
      containers:
        - name: batch
          image: "{{ .Values.batch.image.repository }}:{{ .Values.batch.image.tag }}"
          imagePullPolicy: {{ .Values.batch.image.pullPolicy }}
          env:
            - name: CPU_WORKERS
              value: {{ .Values.batch.cpuWorkers | quote }}
            - name: MEMORY_MB
              value: {{ .Values.batch.memoryMb | quote }}
            - name: GROW_MB_PER_SEC
              value: {{ .Values.batch.growMbPerSec | quote }}
          resources:
            {{- toYaml .Values.batch.resources | nindent 12 }}
