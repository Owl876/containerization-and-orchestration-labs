apiVersion: v1
kind: Pod
metadata:
  name: trusted-images
  labels:
    app: policy-test
spec:
  restartPolicy: Never
  containers:
  - name: test
    image: docker.io/library/nginx:1.27
    imagePullPolicy: Never
    securityContext:
      privileged: false
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
