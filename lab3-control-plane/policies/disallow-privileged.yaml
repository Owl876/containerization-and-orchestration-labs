apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: disallow-privileged
    match:
      any:
      - resources:
          kinds:
          - Pod
    exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kube-public
          - kube-node-lease
          - kyverno
          - cnpg-system
          - monitoring
          - logging
          - tracing
          - local-path-storage
    validate:
      message: Privileged containers are forbidden.
      pattern:
        spec:
          containers:
          - name: '*'
            =(securityContext):
              =(privileged): false
          =(initContainers):
          - name: '*'
            =(securityContext):
              =(privileged): false
          =(ephemeralContainers):
          - name: '*'
            =(securityContext):
              =(privileged): false
