kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.32.2
  - role: worker
    image: kindest/node:v1.32.2
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18000
        listenAddress: "127.0.0.1"
      - containerPort: 30081
        hostPort: 18001
        listenAddress: "127.0.0.1"
      - containerPort: 30300
        hostPort: 13000
        listenAddress: "127.0.0.1"
      - containerPort: 30090
        hostPort: 19090
        listenAddress: "127.0.0.1"
