apiVersion: v1
kind: Pod
metadata:
  name: disallow-privileged
  labels:
    app: policy-test
spec:
  restartPolicy: Never
  containers:
  - name: test
    image: registry.local/shop/app:1.0.0
    imagePullPolicy: Never
    securityContext:
      privileged: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
