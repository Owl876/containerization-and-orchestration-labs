{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: panda-api-dashboard
  labels:
    # сайдкар Grafana из kube-prometheus-stack ищет ConfigMap именно по этому лейблу
    # и сам подхватывает JSON из data — дашборд живёт в git, а не только в Grafana-поде
    grafana_dashboard: "1"
data:
{{ (.Files.Glob "dashboards/*.json").AsConfig | indent 2 }}
{{- end }}
