apiVersion: apps/v1
kind: Deployment
metadata:
  name: panda-api
  labels:
    app: panda-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: panda-api
  template:
    metadata:
      labels:
        app: panda-api
    spec:
      containers:
        - name: panda-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
