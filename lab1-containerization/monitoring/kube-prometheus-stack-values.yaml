# Основа: lab2-observability/observability/kube-prometheus-stack-values.yaml.
# Проверяется с kube-prometheus-stack 92.11.0 на Kubernetes 1.37.

# В minikube эти компоненты слушают на loopback ноды.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false

prometheus:
  prometheusSpec:
    # Как в lab2: подхватываем свои мониторы и правила без фильтра release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    evaluationInterval: 15s
    # cAdvisor работает на Linux-хосте вне Kubernetes.
    additionalScrapeConfigs:
      - job_name: panda-host-cadvisor
        metrics_path: /metrics
        static_configs:
          - targets:
              - host.minikube.internal:8085
    retention: 24h
    retentionSize: 1GB
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

grafana:
  # Пароль создаёт чарт и сохраняет в Kubernetes Secret.
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      # 256Mi оказалось недостаточно: Grafana завершилась с OOMKilled.
      memory: 1Gi

alertmanager:
  # Алерты доступны в UI; внешние уведомления не настроены.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: "null"
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
