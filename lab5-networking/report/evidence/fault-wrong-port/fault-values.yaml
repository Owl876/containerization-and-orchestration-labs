networkPolicy:
  enabled: true
  policies:
  - name: default-deny
    spec:
      podSelector: {}
      policyTypes:
      - Ingress
      - Egress
  - name: dns
    spec:
      podSelector: {}
      policyTypes:
      - Egress
      egress:
      - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
  - name: client
    spec:
      podSelector:
        matchLabels: &id002
          app: panda-client
      policyTypes:
      - Egress
      egress:
      - to:
        - podSelector:
            matchLabels: &id001
              app.kubernetes.io/instance: shop
              app.kubernetes.io/name: api
        ports:
        - port: 8001
          protocol: TCP
  - name: api
    spec:
      podSelector:
        matchLabels: *id001
      policyTypes:
      - Ingress
      - Egress
      ingress:
      - from:
        - podSelector:
            matchLabels: *id002
        ports:
        - port: 8000
          protocol: TCP
      egress:
      - to:
        - podSelector:
            matchLabels: &id003
              cnpg.io/cluster: shop-db
        ports:
        - port: 5432
          protocol: TCP
  - name: worker
    spec:
      podSelector:
        matchLabels: &id004
          app.kubernetes.io/instance: shop
          app.kubernetes.io/name: worker
      policyTypes:
      - Egress
      egress:
      - to:
        - podSelector:
            matchLabels: *id003
        ports:
        - port: 5432
          protocol: TCP
  - name: database
    spec:
      podSelector:
        matchLabels: *id003
      policyTypes:
      - Ingress
      - Egress
      ingress:
      - from:
        - podSelector:
            matchLabels: *id001
        - podSelector:
            matchLabels: *id004
        - podSelector:
            matchLabels: *id003
        ports:
        - port: 5432
          protocol: TCP
      - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
              app.kubernetes.io/instance: cnpg
        ports:
        - port: 8000
          protocol: TCP
      egress:
      - to:
        - podSelector:
            matchLabels: *id003
        ports:
        - port: 5432
          protocol: TCP
        - port: 8000
          protocol: TCP
      - to:
        - ipBlock:
            cidr: 10.96.0.1/32
        ports:
        - port: 443
          protocol: TCP
      - to:
        - ipBlock:
            cidr: 172.18.0.3/32
        ports:
        - port: 6443
          protocol: TCP
