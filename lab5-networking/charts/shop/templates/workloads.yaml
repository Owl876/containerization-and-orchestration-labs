{{- range $name := list "api" "worker" }}
{{- $component := index $.Values $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "shop.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ $component.replicas }}
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "shop.labels" $ | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: "{{ $component.image.repository }}:{{ $component.image.tag }}"
          imagePullPolicy: {{ $component.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: ROLE
              value: {{ $name }}
            - name: HEALTH_FAIL
              value: {{ $component.healthFail | quote }}
            {{- if eq $name "worker" }}
            - name: WORKER_POLL_SECONDS
              value: {{ $component.pollSeconds | quote }}
            {{- end }}
            - name: PGHOST
              value: {{ $.Release.Name }}-db-rw
            - name: PGDATABASE
              value: shop
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-db-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-db-app
                  key: password
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /version, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: [python, -c, "import time; time.sleep(5)"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "shop.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  type: NodePort
  externalTrafficPolicy: {{ $component.externalTrafficPolicy | default "Cluster" }}
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: {{ $component.nodePort }}
{{- end }}
