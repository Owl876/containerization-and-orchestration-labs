name: panda-lab8
x-app: &app
  image: panda-lab8-app:1.0.0
  build: .
  restart: unless-stopped
  init: true

services:
  release-mcp:
    <<: *app
    command: [python, -m, src.release_mcp]
    volumes:
      - ./fixtures:/data:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  knowledge-mcp:
    <<: *app
    command: [python, -m, src.knowledge_mcp]
    volumes:
      - ./fixtures:/data:ro
      - reports:/reports
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:0.40.11
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    volumes:
      - models:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 10

  model-init:
    image: ollama/ollama:0.40.11
    restart: 'no'
    entrypoint: [/bin/sh, -c]
    command: ['ollama pull "$${MODEL}"']
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      ollama:
        condition: service_healthy

  agent:
    <<: *app
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_NUM_THREADS: ${OLLAMA_NUM_THREADS:-4}
      RELEASE_MCP_URL: http://release-mcp:8000/mcp
      KNOWLEDGE_MCP_URL: http://knowledge-mcp:8000/mcp
    ports:
      - '127.0.0.1:${AGENT_PORT:-18088}:8080'
    depends_on:
      release-mcp:
        condition: service_healthy
      knowledge-mcp:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n-init:
    image: n8nio/n8n:2.29.1
    restart: 'no'
    entrypoint: [/bin/sh, -c]
    command: ['n8n import:workflow --input=/workflows/release-brief.json && n8n publish:workflow --id=pandaReleaseBrief8']
    environment: &n8n-env
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_METRICS: 'true'
      N8N_SECURE_COOKIE: 'false'
      GENERIC_TIMEZONE: Europe/Moscow
      TZ: Europe/Moscow
    volumes:
      - n8n:/home/node/.n8n
      - ./workflows:/workflows:ro

  n8n:
    image: n8nio/n8n:2.29.1
    restart: unless-stopped
    environment:
      <<: *n8n-env
      WEBHOOK_URL: http://localhost:${N8N_PORT:-15678}/
    ports:
      - '127.0.0.1:${N8N_PORT:-15678}:5678'
    volumes:
      - n8n:/home/node/.n8n
    depends_on:
      n8n-init:
        condition: service_completed_successfully
      agent:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-19098}:9090'
    volumes:
      - type: bind
        source: ./monitoring/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./monitoring/alerts.yml
        target: /etc/prometheus/alerts.yml
        read_only: true
        bind:
          create_host_path: false
      - prometheus:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-panda-lab8-local}
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-13008}:3000'
    volumes:
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  n8n:
  models:
  reports:
  prometheus:
  grafana:
