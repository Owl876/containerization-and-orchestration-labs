groups:
  - name: panda-release
    rules:
      - alert: PandaReviewErrorRatio
        expr: sum(increase(panda_workflow_runs_total{status="error"}[15m])) / clamp_min(sum(increase(panda_workflow_runs_total{status=~"success|error"}[15m])), 1) > 0.2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'More than 20% of release reviews fail'
          description: 'Inspect agent logs, Ollama and MCP connectivity. BLOCKED decisions are successful reviews.'
      - alert: PandaReviewSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(panda_workflow_duration_seconds_bucket[15m]))) > 180
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Release review p95 exceeds 180 seconds'
          description: 'Inspect CPU pressure, model latency and tool retries; 600 seconds is the hard run timeout.'
      - alert: PandaDependencyUnavailable
        expr: (panda_dependency_up == 0) or (up{job=~"agent|n8n"} == 0) or absent(up{job="agent"}) or absent(up{job="n8n"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'A release workflow dependency is unavailable'
          description: 'Check n8n, the agent, both MCP servers and the configured Ollama model.'
