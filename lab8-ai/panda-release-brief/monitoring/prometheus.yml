global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: agent
    static_configs:
      - targets: ['agent:8080']
  - job_name: n8n
    static_configs:
      - targets: ['n8n:5678']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
